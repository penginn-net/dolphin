name: Publish to GHCR

on:
  push:
    branches:
      - dolphin
  pull_request:
    branches:
      - dolphin

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set branch name
        id: branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${GITHUB_REF#refs/heads/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set commit time
        id: time
        run: echo "value=$(TZ='Asia/Tokyo' date +'%Y%m%d%H%M%S')" >> "$GITHUB_OUTPUT"

      - name: Set tag
        id: tag
        run: |
          DATE="$(TZ='Asia/Tokyo' date +'%Y-%m-%d_%H-%M-%S')_${GITHUB_SHA::7}"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=${{ steps.branch.outputs.value }}_${DATE}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${DATE}" >> "$GITHUB_OUTPUT"
          fi

      - name: Rewrite package.json version
        run: |
          sed -i 's/"version": "1\.4\.0-20231128081000"/"version": "1.4.0-${{ steps.time.outputs.value }}"/' ./package.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.tag.outputs.value }}
            ghcr.io/${{ github.repository }}:latest-${{ steps.branch.outputs.value }}
